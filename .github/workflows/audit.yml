name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught even without a PR.
    - cron: "0 6 * * 1"

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout camproto-odm
        uses: actions/checkout@v7
        with:
          path: camproto-odm

      # camproto-odm depends on camproto-ingest via a relative path
      # (`../camproto-ingest`), so the sibling repo has to be checked out
      # alongside it for cargo-deny to resolve the manifest/lockfile.
      - name: Checkout camproto-ingest
        uses: actions/checkout@v7
        with:
          repository: kalmastenitin/camproto-ingest
          path: camproto-ingest

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: camproto-odm/Cargo.toml
