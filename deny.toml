# cargo-deny configuration.  Run locally:  cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
 
[advisories]
version = 2
# Fail on any RUSTSEC advisory. Add IDs here only with a written justification.
ignore = [
    # ttf-parser is unmaintained; no safe upgrade exists. It's a transitive
    # dep of winit (via sctk-adwaita's Wayland decorations -> ab_glyph ->
    # owned_ttf_parser), not something we depend on directly or can bump
    # ourselves. Revisit when winit moves off it.
    "RUSTSEC-2026-0192",
]
 
[licenses]
version = 2
confidence-threshold = 0.9
# Permissive-only, matching our MIT release and keeping the tree clean.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # epaint bundles its default fonts (Ubuntu Light + a Noto-derived
    # emoji/symbol font) under their own font licenses, in addition to
    # epaint's own MIT/Apache-2.0.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # ffmpeg-sys-next (the Rust binding crate, not FFmpeg itself) is WTFPL —
    # about as permissive as licenses get.
    "WTFPL",
]
 
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Enforce the no-OpenSSL / no-C-crypto posture that keeps the build identical on
# macOS, Windows, and Linux. If a dependency ever drags these back in, CI fails
# and we find out immediately instead of at release time.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
 
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
 